[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "0rb1t-cli"
version = "0.2.0"
description = "0rb1t - customizable terminal intelligence environment with pluggable engines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0rb1t contributors" }]
dependencies = []
keywords = ["cli", "terminal", "opencode", "agent", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/y0x1a/0rb1t"
Repository = "https://github.com/y0x1a/0rb1t"
Issues = "https://github.com/y0x1a/0rb1t/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
"0rb1t" = "orb1t.cli:main"
orb1t = "orb1t.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
